<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazon Review Sentiment Analyzer</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <header>
            <div class="badge">BERT • NLP</div>

            <h1>Amazon Review<br><span>Sentiment Analyzer</span></h1>

            <p class="subtitle">
                Analyze the sentiment of an Amazon product review
                using a fine-tuned BERT model.
            </p>
        </header>

        <section class="card">

            <label for="review">Your Review</label>

            <textarea id="review" placeholder="Write or paste an Amazon product review here..."
                maxlength="5000"></textarea>

            <div class="input-footer">
                <span id="charCount">0 / 5000</span>

                <button id="analyzeBtn">
                    Analyze Sentiment
                </button>
            </div>

        </section>

        <section id="result" class="result hidden">

            <div class="result-header">
                <span>Analysis Result</span>
                <span id="sentimentBadge"></span>
            </div>

            <div class="sentiment-main">
                <div>
                    <p class="result-label">Sentiment</p>
                    <h2 id="sentiment"></h2>
                </div>

                <div class="confidence">
                    <p class="result-label">Confidence</p>
                    <h2 id="confidence"></h2>
                </div>
            </div>

            <div class="probability">
                <div class="probability-label">
                    <span>Negative</span>
                    <span id="negativeProbability"></span>
                </div>

                <div class="bar">
                    <div id="negativeBar"></div>
                </div>
            </div>

            <div class="probability">
                <div class="probability-label">
                    <span>Positive</span>
                    <span id="positiveProbability"></span>
                </div>

                <div class="bar">
                    <div id="positiveBar"></div>
                </div>
            </div>

        </section>

        <p id="error" class="error hidden"></p>

        <footer>
            <p>Powered by BERT • PyTorch • FastAPI</p>
        </footer>

    </main>

    <script src="script.js"></script>
</body>

</html>
